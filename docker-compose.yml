services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: matchmaking
      POSTGRES_PASSWORD: matchmaking
      POSTGRES_DB: matchmaking
    ports:
      - "127.0.0.1:5432:5432"   # só na máquina local, para `make testar` e `make rodar`
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmaking"]
      interval: 2s
      retries: 15

  api:
    build: .
    env_file: .env
    environment:
      # Sem HTTPS local: cookie sem flag Secure. Em produção deixe o padrão (producao).
      AMBIENTE: dev
      DATABASE_URL: postgresql://matchmaking:matchmaking@db:5432/matchmaking
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

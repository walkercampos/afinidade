# Deploy gratuito no Render (Blueprint). O banco fica no Neon (plano gratuito):
# crie o projeto em neon.tech e cole a connection string em DATABASE_URL no painel do Render.
services:
  - type: web
    name: matchmaking
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    # O deploy é disparado pela pipeline do GitHub Actions só depois que lint, testes e
    # auditoria passam (veja .github/workflows/ci.yml).
    autoDeploy: false
    envVars:
      - key: AMBIENTE
        value: producao
      - key: JWT_SECRET
        generateValue: true
      # Cifra mensagens e fotos. Depois de gerada, NÃO troque (os dados antigos ficariam ilegíveis).
      - key: CHAVE_MENSAGENS
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # E-mail: o e-mail das pessoas só é guardado como HMAC com esta chave. NÃO troque depois
      # (quem tem conta deixaria de ser encontrado pelo e-mail).
      - key: EMAIL_PEPPER
        generateValue: true
      # Cifra o e-mail das pessoas (para o app poder mandar avisos). NÃO troque depois.
      - key: CHAVE_EMAIL
        generateValue: true
      - key: EMAIL_PROVEDOR
        value: resend
      # Chave da API do Resend (resend.com → API Keys) e o remetente de um domínio verificado lá.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      # Passkeys: o domínio exato do app, sem https:// (ex.: afinidade.onrender.com) ...
      - key: WEBAUTHN_RP_ID
        sync: false
      # ... e a origem completa (ex.: https://afinidade.onrender.com). Várias: separe por vírgula.
      - key: WEBAUTHN_ORIGENS
        sync: false
      # Verificação de idade (ECA Digital). Obrigatória por lei antes de abrir ao público.
      # Enquanto nenhum provedor real estiver contratado e configurado, o app só sobe com
      # IDADE_OBRIGATORIA=false (fase fechada de testes). Ver docs/plano/parte-03-verificacao-de-idade.md.
      - key: IDADE_OBRIGATORIA
        value: "false"
      - key: IDADE_PROVEDOR
        value: desativado

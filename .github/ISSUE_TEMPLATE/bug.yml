name: Problema
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Não inclua dados pessoais** (e-mail, apelido real, fotos, localização). Se o problema
        envolve segurança ou privacidade, use o relato privado indicado no SECURITY.md.
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations: { required: true }
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra a tela...\n2. Toque em...\n3. Aparece..."
    validations: { required: true }
  - type: input
    id: requisicao
    attributes:
      label: Id da requisição (se apareceu um erro)
      description: Aparece nas mensagens de erro; ajuda a achar o problema sem nenhum dado seu.
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e navegador
      placeholder: "ex.: Android 15, Chrome 140"

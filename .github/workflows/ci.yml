name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchmaking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matchmaking_test
        run: pytest -q
      - name: Vulnerabilidades conhecidas nas dependências
        run: pip install pip-audit && pip-audit -r requirements.txt

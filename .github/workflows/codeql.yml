# Análise de segurança do código (CodeQL): procura injeção de SQL, XSS, vazamento de dados e
# outros padrões de vulnerabilidade no Python e no JavaScript. Gratuita em repositório público.
# Os alertas aparecem em Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "41 8 * * 1"   # toda segunda, 05:41 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.linguagem }}

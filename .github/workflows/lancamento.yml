# Lançamento de versão: ao enviar uma tag vX.Y.Z, cria o Release no GitHub com as notas do
# CHANGELOG.md. A tag precisa bater com app/__init__.py (VERSAO). Passo a passo em
# docs/operacao.md.
name: Lançamento

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Conferir a versão
        run: |
          versao="${GITHUB_REF_NAME#v}"
          no_codigo=$(python3 -c 'import re,pathlib; print(re.search(r"VERSAO = \"(.+)\"", pathlib.Path("app/__init__.py").read_text())[1])')
          if [ "$versao" != "$no_codigo" ]; then
            echo "::error::A tag ($GITHUB_REF_NAME) não bate com VERSAO em app/__init__.py ($no_codigo)."
            exit 1
          fi
      - name: Extrair as notas do CHANGELOG
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/     { exit }
            dentro && /^\[.*\]: /  { exit }
            dentro                 { print }
          ' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "::error::CHANGELOG.md não tem a seção [$versao]."
            exit 1
          fi
          cat notas.md
      - name: Criar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Afinidade $GITHUB_REF_NAME" --notes-file notas.md --verify-tag
